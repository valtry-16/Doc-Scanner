services:
  - type: web
    name: document-processor-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Note: OCR feature requires paid tier for tesseract-ocr installation
    # Or use Render Native Environment (paid feature)
    envVars:
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: OUTPUT_DIR
        value: /tmp/output
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: FILE_RETENTION_MINUTES
        value: 30
      - key: MAX_WORKERS
        value: 2  # Adjust based on plan (free: 2, starter: 4)
      - key: TASK_TIMEOUT
        value: 300
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app  # UPDATE THIS after deploying frontend
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
