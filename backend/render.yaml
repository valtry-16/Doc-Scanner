services:
  - type: web
    name: document-processor-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    region: oregon  # Choose: oregon, frankfurt, singapore, ohio, etc.
    plan: free  # Change to 'starter' for production (always-on, $7/mo)
    healthCheckPath: /health
    envVars:
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: OUTPUT_DIR
        value: /tmp/output
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: FILE_RETENTION_MINUTES
        value: 30
      - key: MAX_WORKERS
        value: 2  # Adjust based on plan (free: 2, starter: 4)
      - key: TASK_TIMEOUT
        value: 300
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app  # UPDATE THIS after deploying frontend
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
